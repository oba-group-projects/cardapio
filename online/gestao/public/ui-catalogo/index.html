<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Catálogo Oba Doceria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --brand: #8B4513;
    --brand-light: #f5ece4;
    --text: #3B2A1E;
    --muted: #8B7355;
    --bg: #FAF5F0;
    --card-bg: #fff;
    --line: #E8D5B5;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Plus Jakarta Sans', system-ui, sans-serif; overflow: hidden; }

  /* ── PÁGINAS ── */
  .oba-page {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 32px 24px;
    opacity: 0; pointer-events: none; transition: opacity .35s ease;
  }
  .oba-page.active { opacity: 1; pointer-events: auto; }
  /* Pg 3 e 4 têm scroll */
  #pg-3, #pg-4 { justify-content: flex-start; overflow-y: auto; padding-bottom: 100px; }

  /* ── PG 1 — ABERTURA ── */
  #pg-1 .logo { width: 160px; height: auto; object-fit: contain; margin-bottom: 24px; }
  #pg-1 .titulo {
    font-family: 'Cormorant Garamond', serif;
    font-size: 28px; font-weight: 300; letter-spacing: .2em;
    text-transform: uppercase; color: var(--brand);
    text-align: center; margin-bottom: 8px;
  }
  #pg-1 .subtitulo {
    font-size: 13px; color: var(--muted); letter-spacing: .1em;
    text-align: center; margin-bottom: 40px;
  }

  /* ── PG 2 — APRESENTAÇÃO ── */
  #pg-2 .logo { width: 80px; height: 80px; object-fit: contain; border-radius: 50%; margin-bottom: 24px; }
  #pg-2 .titulo-pg2 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px; font-weight: 400; color: var(--brand);
    text-align: center; margin-bottom: 20px;
  }
  #pg-2 .texto-pg2 {
    font-size: 14px; line-height: 1.8; color: var(--text);
    text-align: center; max-width: 360px;
  }
  #pg-2 .citacao {
    font-family: 'Cormorant Garamond', serif;
    font-size: 16px; font-style: italic; color: var(--muted);
    text-align: center; margin-top: 20px; max-width: 320px;
  }

  /* ── PG 3 — MENU ── */
  #pg-3 { padding-top: 48px; }
  #pg-3 .logo-menu { width: 120px; height: auto; object-fit: contain; margin: 0 auto 20px; display: block; }
  #pg-3 .subtitulo-menu {
    font-size: 11px; text-transform: uppercase; letter-spacing: .2em;
    color: var(--muted); text-align: center; margin-bottom: 32px;
  }
  .oba-cat-btn {
    width: 100%; max-width: 400px;
    background: var(--card-bg); border: 1px solid var(--line);
    border-radius: 2rem; padding: 20px 24px;
    display: flex; justify-content: space-between; align-items: center;
    cursor: pointer; transition: all .2s; margin-bottom: 14px;
    font-family: inherit;
  }
  .oba-cat-btn:active { transform: scale(.97); }
  .oba-cat-btn.destaque { background: var(--brand); border-color: var(--brand); }
  .oba-cat-btn .btn-sub { display: block; font-size: 9px; text-transform: uppercase; letter-spacing: .15em; color: var(--muted); margin-bottom: 4px; }
  .oba-cat-btn .btn-lbl { display: block; font-size: 15px; font-weight: 600; color: var(--text); }
  .oba-cat-btn.destaque .btn-sub { color: rgba(255,255,255,.6); }
  .oba-cat-btn.destaque .btn-lbl { color: #fff; }
  .oba-cat-btn .btn-ico { font-size: 20px; color: var(--muted); opacity: .4; }
  .oba-cat-btn.destaque .btn-ico { color: rgba(255,255,255,.4); opacity: 1; }

  /* ── PG 4 — SABORES ── */
  #pg-4 { padding-top: 48px; }
  #pg-4 > * { width: 100%; max-width: 100%; min-width: 0; }
  .pg4-header { text-align: center; margin-bottom: 20px; width: 100%; }
  .pg4-titulo { font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 400; color: var(--brand); margin-bottom: 4px; }
  .pg4-subtitulo { font-size: 11px; text-transform: uppercase; letter-spacing: .15em; color: var(--muted); }

  /* Abas de categoria */
  .oba-abas { display: flex; gap: 8px; overflow-x: auto; overflow-y: visible; padding-bottom: 4px; margin-bottom: 20px; width: 100%; max-width: 100%; min-width: 0; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .oba-abas::-webkit-scrollbar { display: none; }
  .oba-aba {
    flex-shrink: 0; background: var(--brand-light); color: var(--brand);
    border: none; border-radius: 999px; padding: 7px 16px;
    font: inherit; font-size: 12px; font-weight: 500; cursor: pointer; transition: all .15s;
    white-space: nowrap;
  }
  .oba-aba.active { background: var(--brand); color: #fff; }

  /* Grid de sabores */
  .oba-sabores-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; width: 100%; }
  .oba-sabor-card {
    background: var(--card-bg); border: 1px solid var(--line);
    border-radius: 1.25rem; overflow: hidden; transition: border-color .15s;
  }
  .oba-sabor-card:active { border-color: var(--brand); }
  .oba-sabor-img { width: 100%; aspect-ratio: 1; object-fit: cover; background: var(--brand-light); display: block; }
  .oba-sabor-img-placeholder { width: 100%; aspect-ratio: 1; background: var(--brand-light); display: flex; align-items: center; justify-content: center; }
  .oba-sabor-img-placeholder span { font-size: 28px; opacity: .3; }
  .oba-sabor-info { padding: 10px 12px; }
  .oba-sabor-nome { font-size: 12px; font-weight: 600; color: var(--text); line-height: 1.3; }
  .oba-sabor-preco { font-size: 12px; color: var(--brand); font-weight: 500; margin-top: 4px; }

  /* ── BOTÃO CTA GENÉRICO ── */
  .oba-btn-cta {
    background: var(--brand); color: #fff; border: none; border-radius: 999px;
    padding: 14px 28px; font: inherit; font-size: 14px; font-weight: 600;
    cursor: pointer; transition: opacity .15s; margin-top: 32px;
  }
  .oba-btn-cta:active { opacity: .85; }
  .oba-btn-cta.outline {
    background: transparent; color: var(--brand);
    border: 1.5px solid var(--brand);
  }

  /* ── BOTÕES FLUTUANTES (pg4) ── */
  .oba-float-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: linear-gradient(transparent, var(--bg) 40%);
    padding: 16px 20px 24px;
    display: flex; gap: 10px; justify-content: center;
    pointer-events: none;
  }
  .oba-float-bar button { pointer-events: auto; }
  .oba-float-btn-wpp {
    flex: 1; max-width: 200px;
    background: #25D366; color: #fff; border: none; border-radius: 999px;
    padding: 13px 18px; font: inherit; font-size: 13px; font-weight: 600;
    cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .oba-float-btn-cardapio {
    flex: 1; max-width: 200px;
    background: var(--brand); color: #fff; border: none; border-radius: 999px;
    padding: 13px 18px; font: inherit; font-size: 13px; font-weight: 600;
    cursor: pointer;
  }

  /* ── BOTÃO VOLTAR ── */
  .oba-btn-voltar {
    background: transparent; border: none; color: var(--muted);
    font: inherit; font-size: 11px; font-weight: 600; letter-spacing: .1em;
    text-transform: uppercase; cursor: pointer; padding: 8px 0; margin-top: 8px;
  }

  /* ── LOADING ── */
  #loading { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 999; }
  #loading .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--brand); margin: 0 4px; animation: pulse .8s ease-in-out infinite; }
  #loading .dot:nth-child(2) { animation-delay: .15s; }
  #loading .dot:nth-child(3) { animation-delay: .3s; }
  @keyframes pulse { 0%,100%{opacity:.2;transform:scale(.8)} 50%{opacity:1;transform:scale(1)} }

  /* ── LIGHTBOX ── */
  #cat-lightbox {
    position: fixed; inset: 0; z-index: 1000;
    background: rgba(0,0,0,.82);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 20px;
    opacity: 0; pointer-events: none;
    transition: opacity .2s ease;
  }
  #cat-lightbox.open { opacity: 1; pointer-events: auto; }
  #cat-lightbox img {
    max-width: min(88vw, 420px); max-height: 60vh;
    object-fit: contain; border-radius: 1rem;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
    display: block;
  }
  #cat-lightbox .lb-nome {
    color: #fff; font-size: 15px; font-weight: 600;
    text-align: center; margin-top: 16px;
  }
  #cat-lightbox .lb-preco {
    color: rgba(255,255,255,.75); font-size: 13px;
    text-align: center; margin-top: 4px;
  }
  #cat-lightbox .lb-fechar {
    position: absolute; top: 16px; right: 20px;
    background: rgba(255,255,255,.15); border: none;
    color: #fff; font-size: 22px; line-height: 1;
    width: 38px; height: 38px; border-radius: 50%;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
</style>
</head>
<body>

<!-- Loading -->
<div id="loading"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>

<!-- Lightbox -->
<div id="cat-lightbox" onclick="catFecharLightbox()">
  <button class="lb-fechar" onclick="catFecharLightbox()" aria-label="Fechar">×</button>
  <img id="cat-lb-img" src="" alt="">
  <p class="lb-nome" id="cat-lb-nome"></p>
  <p class="lb-preco" id="cat-lb-preco"></p>
</div>

<!-- Página 1 — Abertura -->
<div class="oba-page" id="pg-1">
  <img id="cat-pg1-logo" src="" alt="Oba Doceria" class="logo" onerror="this.style.display='none'">
  <h1 class="titulo" id="cat-pg1-titulo">Catálogo Oba Doceria</h1>
  <p class="subtitulo">Sabores artesanais feitos com amor</p>
  <button class="oba-btn-cta" onclick="catNavegar(2)">Conhecer →</button>
</div>

<!-- Página 2 — Apresentação -->
<div class="oba-page" id="pg-2">
  <img id="cat-pg2-logo" src="" alt="Oba Doceria" class="logo" onerror="this.style.display='none'">
  <h2 class="titulo-pg2" id="cat-pg2-titulo">Nossa Essência</h2>
  <div style="max-width:380px">
    <p class="texto-pg2" id="cat-pg2-texto"></p>
    <p class="citacao" id="cat-pg2-citacao"></p>
  </div>
  <button class="oba-btn-cta" style="margin-top:32px" onclick="catNavegar(3)">Ver os Sabores →</button>
  <button class="oba-btn-voltar" onclick="catNavegar(1)">← Voltar</button>
</div>

<!-- Página 3 — Menu de grupos -->
<div class="oba-page" id="pg-3">
  <img id="cat-pg3-logo" src="" alt="Oba Doceria" class="logo-menu" onerror="this.style.display='none'">
  <p class="subtitulo-menu">Escolha o tipo de doce</p>
  <div id="cat-grupos" style="width:100%;max-width:400px;display:flex;flex-direction:column;align-items:center"></div>
  <button class="oba-btn-voltar" onclick="catNavegar(2)">← Voltar</button>
</div>

<!-- Página 4 — Sabores do grupo -->
<div class="oba-page" id="pg-4">
  <div class="pg4-header">
    <h2 class="pg4-titulo" id="cat-pg4-titulo"></h2>
    <p class="pg4-subtitulo" id="cat-pg4-subtitulo"></p>
  </div>
  <div class="oba-abas" id="cat-abas"></div>
  <div class="oba-sabores-grid" id="cat-sabores"></div>
  <button class="oba-btn-voltar" style="margin-bottom:80px" onclick="catNavegar(3)">← Voltar</button>

  <!-- Botões flutuantes -->
  <div class="oba-float-bar">
    <button class="oba-float-btn-wpp" id="cat-btn-wpp">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.117.549 4.107 1.512 5.84L0 24l6.335-1.481A11.942 11.942 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 21.818a9.818 9.818 0 01-5.003-1.37l-.36-.214-3.72.869.935-3.614-.235-.372A9.818 9.818 0 012.182 12C2.182 6.58 6.58 2.182 12 2.182c5.42 0 9.818 4.398 9.818 9.818 0 5.42-4.398 9.818-9.818 9.818z"/></svg>
      Pedir via WhatsApp
    </button>
    <button class="oba-float-btn-cardapio" id="cat-btn-cardapio" onclick="window.location.href='/cardapio?start=3'">
      Montar pedido →
    </button>
  </div>
</div>

<script>
/* ================================================================
   CATÁLOGO OBA DOCERIA — /catalogo
   Lê dados do slot PUBLISHED via published-bootstrap.js
================================================================ */

let _catDados = null;        // { sabores, categorias, loja, tema }
let _catGrupoAtivo = null;   // 'artesanais' | 'finos'
let _catCatAtiva = 'todos';  // id da categoria ou 'todos'
let _catExibirPrecos = true; // configurável futuramente
let _catPaginaAtual = 1;

/* ── NAVEGAÇÃO ── */
function catNavegar(num) {
  document.querySelectorAll('.oba-page').forEach(p => p.classList.remove('active'));
  document.getElementById('pg-' + num)?.classList.add('active');
  _catPaginaAtual = num;
  window.scrollTo({ top: 0 });
}

/* ── RESOLVER URL DE IMAGEM ── */
function catImageUrl(path) {
  if (!path) return '';
  if (path.startsWith('http://') || path.startsWith('https://') || path.startsWith('data:')) return path;
  const clean = path.replace(/\\/g, '/').replace(/^\/+/, '');
  return '/' + clean;
}

/* ── MONTAR PG 1 ── */
function catMontarPg1(dados) {
  const pg1Logo = dados.tema?.paginas?.boas_vindas?.logo || dados.tema?.paginas?.menu_principal?.logo || '';
  const logoEl = document.getElementById('cat-pg1-logo');
  if (pg1Logo && logoEl) { logoEl.src = catImageUrl(pg1Logo); logoEl.style.display = ''; }
  else if (logoEl) logoEl.style.display = 'none';
}

/* ── MONTAR PG 2 ── */
function catMontarPg2(dados) {
  const ne = dados.tema?.paginas?.nossa_essencia || {};
  const logoEl = document.getElementById('cat-pg2-logo');
  if (ne.logo && logoEl) { logoEl.src = catImageUrl(ne.logo); logoEl.style.display = ''; }
  else if (logoEl) logoEl.style.display = 'none';

  const tituloEl = document.getElementById('cat-pg2-titulo');
  if (tituloEl && ne.titulo) tituloEl.textContent = ne.titulo;

  const textoEl = document.getElementById('cat-pg2-texto');
  if (textoEl && ne.texto) textoEl.textContent = ne.texto;

  const citacaoEl = document.getElementById('cat-pg2-citacao');
  if (citacaoEl && ne.citacao) {
    citacaoEl.textContent = '"' + ne.citacao.replace(/^"|"$/g, '') + '"';
    citacaoEl.style.display = '';
  } else if (citacaoEl) citacaoEl.style.display = 'none';
}

/* ── MONTAR PG 3 — grupos ── */
function catMontarPg3(dados) {
  const mp = dados.tema?.paginas?.menu_principal || {};
  const logoEl = document.getElementById('cat-pg3-logo');
  if (mp.logo && logoEl) { logoEl.src = catImageUrl(mp.logo); logoEl.style.display = ''; }
  else if (logoEl) logoEl.style.display = 'none';

  /* Descobre quais grupos têm categorias */
  const cats = dados.categorias || [];
  const temArtesanais = cats.some(c => c.grupoCatalogo === 'artesanais' && c.ativo !== false);
  const temFinos      = cats.some(c => c.grupoCatalogo === 'finos'      && c.ativo !== false);

  const container = document.getElementById('cat-grupos');
  container.innerHTML = '';

  if (temArtesanais) {
    const btn = document.createElement('button');
    btn.className = 'oba-cat-btn destaque';
    btn.innerHTML = '<div><span class="btn-sub">Artesanais</span><span class="btn-lbl">Doces Artesanais</span></div><span class="btn-ico">🍫</span>';
    btn.onclick = () => catAbrirGrupo('artesanais', 'Doces Artesanais', 'Tradicionais, Clássicos e Especiais', dados);
    container.appendChild(btn);
  }

  if (temFinos) {
    const btn = document.createElement('button');
    btn.className = 'oba-cat-btn';
    btn.innerHTML = '<div><span class="btn-sub">Exclusivos</span><span class="btn-lbl">Doces Finos</span></div><span class="btn-ico">✨</span>';
    btn.onclick = () => catAbrirGrupo('finos', 'Doces Finos', 'Linha exclusiva', dados);
    container.appendChild(btn);
  }

  if (!temArtesanais && !temFinos) {
    container.innerHTML = '<p style="color:var(--muted);font-size:13px;text-align:center;padding:32px 0">Nenhum grupo configurado ainda.</p>';
  }
}

/* ── ABRIR GRUPO → PG 4 ── */
function catAbrirGrupo(grupo, titulo, subtitulo, dados) {
  _catGrupoAtivo = grupo;
  _catCatAtiva = 'todos';

  document.getElementById('cat-pg4-titulo').textContent = titulo;
  document.getElementById('cat-pg4-subtitulo').textContent = subtitulo;

  const cats = (dados.categorias || []).filter(c => c.grupoCatalogo === grupo && c.ativo !== false);
  catMontarAbas(cats);
  catRenderizarSabores(dados, grupo, 'todos');
  catNavegar(4);
}

/* ── MONTAR ABAS DE CATEGORIA (agrupadas por nome base) ── */
function catMontarAbas(cats) {
  const container = document.getElementById('cat-abas');
  container.innerHTML = '';

  const btnTodos = document.createElement('button');
  btnTodos.className = 'oba-aba active';
  btnTodos.textContent = 'Todos';
  btnTodos.dataset.cat = 'todos';
  btnTodos.onclick = () => catSelecionarAba('todos', btnTodos);
  container.appendChild(btnTodos);

  /* Agrupa categorias pelo nome base (remove sufixo " I", " II", " III", etc.)
     para não mostrar "Tradicionais I" e "Tradicionais II" como abas separadas */
  const grupos = new Map(); // nomeBase → [cat, ...]
  cats.sort((a, b) => (a.ordem ?? 0) - (b.ordem ?? 0)).forEach(cat => {
    const nomeBase = cat.nome.replace(/\s+[IVX]+$/i, '').trim();
    if (!grupos.has(nomeBase)) grupos.set(nomeBase, []);
    grupos.get(nomeBase).push(cat);
  });

  grupos.forEach((catList, nomeBase) => {
    const ids = catList.map(c => c.id);
    const btn = document.createElement('button');
    btn.className = 'oba-aba';
    btn.textContent = nomeBase;
    btn.dataset.cat = ids.join(','); // múltiplos IDs separados por vírgula
    btn.onclick = () => catSelecionarAba(ids.join(','), btn);
    container.appendChild(btn);
  });
}

/* ── SELECIONAR ABA ── */
function catSelecionarAba(catId, btnEl) {
  _catCatAtiva = catId;
  document.querySelectorAll('.oba-aba').forEach(b => b.classList.remove('active'));
  btnEl.classList.add('active');
  catRenderizarSabores(_catDados, _catGrupoAtivo, catId);
}

/* ── RENDERIZAR SABORES ── */
function catRenderizarSabores(dados, grupo, catId) {
  const cats = (dados.categorias || []).filter(c => c.grupoCatalogo === grupo && c.ativo !== false);
  const catIds = new Set(cats.map(c => String(c.id)));

  /* catId pode ser 'todos' ou IDs separados por vírgula (agrupamento por nome base) */
  const filtroIds = catId !== 'todos'
    ? new Set(catId.split(',').map(s => s.trim()))
    : null;

  let sabores = (dados.sabores || []).filter(s => {
    if (s.ativo === false || s.disponivel === false) return false;
    if (!catIds.has(String(s.categoriaId))) return false;
    if (filtroIds && !filtroIds.has(String(s.categoriaId))) return false;
    return true;
  }).sort((a, b) => String(a.nome).localeCompare(String(b.nome), 'pt-BR'));

  const grid = document.getElementById('cat-sabores');
  grid.innerHTML = '';

  if (!sabores.length) {
    grid.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:var(--muted);padding:32px 0;font-size:13px">Nenhum sabor encontrado.</p>';
    return;
  }

  sabores.forEach(s => {
    const card = document.createElement('div');
    card.className = 'oba-sabor-card';
    card.style.cursor = 'pointer';

    const imgUrl = catImageUrl(s.imagem);
    if (imgUrl) {
      const img = document.createElement('img');
      img.className = 'oba-sabor-img';
      img.src = imgUrl;
      img.alt = s.nome;
      img.loading = 'lazy';
      img.onerror = () => { img.replaceWith(catPlaceholder()); };
      card.appendChild(img);
    } else {
      card.appendChild(catPlaceholder());
    }

    const info = document.createElement('div');
    info.className = 'oba-sabor-info';
    const nome = document.createElement('p');
    nome.className = 'oba-sabor-nome';
    nome.textContent = s.nome;
    info.appendChild(nome);

    if (_catExibirPrecos && s.preco != null) {
      const preco = document.createElement('p');
      preco.className = 'oba-sabor-preco';
      preco.textContent = 'R$ ' + Number(s.preco).toFixed(2).replace('.', ',');
      info.appendChild(preco);
    }

    card.appendChild(info);

    /* Clique abre lightbox */
    const precoTxt = (_catExibirPrecos && s.preco != null)
      ? 'R$ ' + Number(s.preco).toFixed(2).replace('.', ',')
      : '';
    card.onclick = () => catAbrirLightbox(catImageUrl(s.imagem), s.nome, precoTxt);

    grid.appendChild(card);
  });
}

/* ── LIGHTBOX ── */
function catAbrirLightbox(imgUrl, nome, preco) {
  const lb = document.getElementById('cat-lightbox');
  const img = document.getElementById('cat-lb-img');
  const nomeEl = document.getElementById('cat-lb-nome');
  const precoEl = document.getElementById('cat-lb-preco');
  if (!lb) return;
  if (img) { img.src = imgUrl || ''; img.style.display = imgUrl ? '' : 'none'; }
  if (nomeEl) nomeEl.textContent = nome || '';
  if (precoEl) { precoEl.textContent = preco || ''; precoEl.style.display = preco ? '' : 'none'; }
  lb.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function catFecharLightbox() {
  const lb = document.getElementById('cat-lightbox');
  if (lb) lb.classList.remove('open');
  document.body.style.overflow = '';
}

function catPlaceholder() {
  const div = document.createElement('div');
  div.className = 'oba-sabor-img-placeholder';
  div.innerHTML = '<span>🍬</span>';
  return div;
}

/* ── CONFIGURAR WHATSAPP ── */
function catConfigurarWpp(dados) {
  const wpp = dados.loja?.store?.whatsapp || dados.loja?.whatsapp || '';
  const btn = document.getElementById('cat-btn-wpp');
  if (btn && wpp) {
    btn.onclick = () => window.open('https://wa.me/' + wpp.replace(/\D/g, ''), '_blank', 'noopener,noreferrer');
  }
}

/* ── INICIALIZAÇÃO ── */
async function catIniciar() {
  try {
    const [catJson, flavJson, temaJson, lojaJson] = await Promise.all([
      fetch('../data/catalog-v1/categories.json').then(r => r.json()),
      fetch('../data/catalog-v1/flavors.json').then(r => r.json()),
      fetch('../data/catalog-v1/theme.json').then(r => r.json()),
      fetch('../data/catalog-v1/config.json').then(r => r.json()),
    ]);

    _catDados = {
      categorias: Array.isArray(catJson) ? catJson : (catJson.categories || catJson.categorias || []),
      sabores:    Array.isArray(flavJson) ? flavJson : (flavJson.flavors || flavJson.sabores || []),
      tema:       temaJson,
      loja:       lojaJson
    };

    catMontarPg1(_catDados);
    catMontarPg2(_catDados);
    catMontarPg3(_catDados);
    catConfigurarWpp(_catDados);

    document.getElementById('loading').style.display = 'none';
    catNavegar(1);

  } catch(err) {
    console.error('[catalogo] Erro ao carregar dados:', err);
    document.getElementById('loading').innerHTML = '<p style="color:#8B4513;font-size:14px;text-align:center;padding:24px">Erro ao carregar o catálogo.<br>Tente novamente.</p>';
  }
}

catIniciar();
</script>
