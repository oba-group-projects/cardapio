name: Sync Cardapio para GitHub Pages

on:
  push:
    branches:
      - feature/gestao-online-segura
    paths:
      - 'online/gestao/public/ui-desenvolvimento/index.html'

jobs:
  sync:
    name: Copiar cardapio para main
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip-sync]')"
    permissions:
      contents: write
    steps:
      - name: Checkout repositorio completo
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Buscar branch feature
        run: git fetch origin feature/gestao-online-segura

      - name: Copiar arquivo do cardapio para raiz do main
        run: |
          git checkout origin/feature/gestao-online-segura \
            -- online/gestao/public/ui-desenvolvimento/index.html
          cp online/gestao/public/ui-desenvolvimento/index.html \
             ui-desenvolvimento/index.html
          git restore online/gestao/public/ui-desenvolvimento/index.html 2>/dev/null || true

      - name: Verificar se ha mudancas
        id: check
        run: |
          if git diff --quiet ui-desenvolvimento/index.html; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commitar e publicar
        if: steps.check.outputs.changed == 'true'
        run: |
          git add ui-desenvolvimento/index.html
          git commit -m "chore(auto-sync): cardapio publico atualizado [skip-sync]"
          git push origin main
